name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Arch ships current Qt 6 / KF6 and the Dolphin headers (DolphinVcs).
    container: archlinux:latest
    strategy:
      matrix:
        workflow: [test, release]
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel cmake ninja extra-cmake-modules qt6-base kio dolphin git subversion
      - uses: actions/checkout@v4
      - name: Run workflow
        run: cmake --workflow --preset ${{ matrix.workflow }}
